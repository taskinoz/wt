[package]
name = "wt"
version = "0.2.0"
edition = "2021"
description = "Minimal git worktree helper: fast worktree creation with agent/env-file pre-population"

[[bin]]
name = "wt"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true
